[workspace]
resolver = "2"
members = [
  "crates/engined",
  "crates/eqlog",
  "crates/fold",
  "crates/parity",
  "crates/protocol",
  "crates/protocol-codegen",
]

# THE ENGINE (JOS-459). Today this workspace holds the protocol contract (`protocol`, JOS-464), the
# PARSER and TAILER (`eqlog`, JOS-469/JOS-472) — proven byte-identical against the TS pipeline's
# recorded event streams by the `parity` binary beside it — and the process that answers the
# protocol over loopback TCP and INGESTS through them (`engined`, JOS-466/JOS-474): a spawn
# contract, a handshake, the ops, and one attach that scans a log and then tails it. The FOLD lands
# in a later crate and reaches `engined` through one sink trait.
#
# TWO STANDING RULES FOR EVERYTHING UNDER engine/:
#   * Nothing here may shell out to powershell.exe, ever, at build time or at run time.
#     PowerShell binaries are the antivirus trigger this app already spent a release eliminating,
#     and a Rust process spawning one would put it straight back.
#   * The engine runs at below-normal process priority (owner ruling: the person at this machine
#     is playing EverQuest). Nothing in the build may pin a core or spawn unbounded parallelism.

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "FSL-1.1-MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
